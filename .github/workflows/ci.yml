name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and audit panel
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm audit --audit-level=moderate
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - name: Stage embedded panel
        run: cp -R frontend/dist/. backend/internal/api/dist/
      - name: Tests, race detector and vet
        working-directory: backend
        run: |
          go test -race ./...
          go vet ./...
      - name: Static analysis
        working-directory: backend
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
      - name: Check scripts
        run: |
          bash -n scripts/install-hesar.sh scripts/build-linux-release.sh scripts/test-release-installer.sh
          python3 -m py_compile scripts/fetch-release-cores.py scripts/package-linux-release.py scripts/test-linux-layer3.py scripts/test-managed-transports.py backend/internal/provision/layer3_helper.py
      - name: Build Linux artifacts
        env:
          BUILD_VERSION: ci-${{ github.sha }}
          HESAR_REPOSITORY: ${{ github.repository }}
        run: bash scripts/build-linux-release.sh
      - name: Validate installer against artifacts
        # Root is confined to disposable runner test directories/namespaces.
        run: sudo bash scripts/test-release-installer.sh
      - name: Test GRE and IPIP with TCP, QUIC and KCP
        run: sudo python3 scripts/test-linux-layer3.py
      - name: Test panel-managed carriers and peer setup
        run: sudo python3 scripts/test-managed-transports.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hesar-linux-${{ github.sha }}
          path: |
            release/hesar-linux-*.tar.gz
            release/install-hesar.sh
            release/checksums-sha256.txt
            release/BUILDINFO.json
          if-no-files-found: error
          retention-days: 14
