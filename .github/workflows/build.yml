name: Build & Release HESAR

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'

jobs:
  build:
    name: Build All
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Copy frontend to backend
        run: |
          rm -rf backend/internal/api/dist
          cp -r frontend/dist backend/internal/api/dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build Linux amd64
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }} -X main.BuildDate=$(date +%Y-%m-%d)" \
            -o ../release/hesar-linux-amd64 \
            cmd/hesar/main.go

      - name: Build Linux arm64
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }} -X main.BuildDate=$(date +%Y-%m-%d)" \
            -o ../release/hesar-linux-arm64 \
            cmd/hesar/main.go

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Prepare release assets
        run: |
          mkdir -p release

          cp scripts/hesar.sh release/
          cp README.md release/
          cp LICENSE release/

          # Keep hesar.sh's displayed VERSION in perfect sync with the
          # git tag this release was built from (same source of truth
          # already used for -X main.Version above), instead of a
          # manually-maintained constant inside the script that can
          # silently drift out of date with every release.
          # GITHUB_REF_NAME is an automatic Actions env var equal to the
          # tag name (e.g. "v1.1.9"); strip the leading "v" to match the
          # script's existing bare-number style ("1.0.0").
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^VERSION=\".*\"/VERSION=\"${TAG_VERSION}\"/" release/hesar.sh

          cd release
          tar -czf ../hesar-linux-amd64.tar.gz hesar-linux-amd64 hesar.sh README.md LICENSE
          tar -czf ../hesar-linux-arm64.tar.gz hesar-linux-arm64 hesar.sh README.md LICENSE
          cd ..

          sha256sum release/hesar-linux-amd64 release/hesar-linux-arm64 release/hesar.sh > checksums-sha256.txt

      - name: Sign checksum manifest and install script (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign-blob --yes \
            --output-signature checksums-sha256.txt.sig \
            --output-certificate checksums-sha256.txt.pem \
            checksums-sha256.txt

          cosign sign-blob --yes \
            --output-signature release/hesar.sh.sig \
            --output-certificate release/hesar.sh.pem \
            release/hesar.sh

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          if [ -z "$PREV_TAG" ]; then
            echo "Initial release of HESAR Anti-DPI Tunnel Suite." >> CHANGELOG.md
          else
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Quick Install" >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo 'bash <(curl -fsSL https://raw.githubusercontent.com/Meytiz/HESAR/main/scripts/hesar.sh)' >> CHANGELOG.md
          echo '```' >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Verification" >> CHANGELOG.md
          echo "Binaries and hesar.sh are hashed in checksums-sha256.txt, signed keylessly via cosign/Sigstore (GitHub Actions OIDC identity)." >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo 'cosign verify-blob \\' >> CHANGELOG.md
          echo '  --certificate checksums-sha256.txt.pem \\' >> CHANGELOG.md
          echo '  --signature checksums-sha256.txt.sig \\' >> CHANGELOG.md
          echo '  --certificate-identity-regexp "^https://github.com/Meytiz/HESAR/.github/workflows/build.yml@refs/tags/.*$" \\' >> CHANGELOG.md
          echo '  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\' >> CHANGELOG.md
          echo '  checksums-sha256.txt' >> CHANGELOG.md
          echo '```' >> CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "HESAR ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            release/hesar-linux-amd64
            release/hesar-linux-arm64
            hesar-linux-amd64.tar.gz
            hesar-linux-arm64.tar.gz
            checksums-sha256.txt
            checksums-sha256.txt.sig
            checksums-sha256.txt.pem
            release/hesar.sh.sig
            release/hesar.sh.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}