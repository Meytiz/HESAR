name: Build & Release HESAR
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
            echo 'Expected a version tag such as v2.0.0 or v2.0.0-beta.1' >&2
            exit 1
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and audit panel
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          npm ci
          npm run build
          npm audit --audit-level=moderate
      - name: Stage embedded panel
        run: cp -R frontend/dist/. backend/internal/api/dist/
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - name: Test and vet
        working-directory: backend
        run: |
          go test -race ./...
          go vet ./...
      - name: Staticcheck and vulnerability scan
        working-directory: backend
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Check scripts
        run: |
          bash -n scripts/install-hesar.sh scripts/build-linux-release.sh scripts/test-release-installer.sh
          python3 -m py_compile scripts/fetch-release-cores.py scripts/package-linux-release.py scripts/test-linux-layer3.py scripts/test-managed-transports.py backend/internal/provision/layer3_helper.py
      - name: Build and package both Linux architectures
        env:
          BUILD_VERSION: ${{ github.ref_name }}
          HESAR_REPOSITORY: ${{ github.repository }}
        run: bash scripts/build-linux-release.sh
      - name: Validate installer against artifacts
        run: sudo bash scripts/test-release-installer.sh
      - name: Test GRE and IPIP with TCP, QUIC and KCP
        run: sudo python3 scripts/test-linux-layer3.py
      - name: Test panel-managed carriers and peer setup
        run: sudo python3 scripts/test-managed-transports.py
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign manifest and installer
        working-directory: release
        run: |
          cosign sign-blob --yes \
            --bundle checksums-sha256.txt.sigstore.json checksums-sha256.txt
          cosign sign-blob --yes \
            --bundle install-hesar.sh.sigstore.json install-hesar.sh
          # Compatibility assets for installations using older Cosign.
          cosign sign-blob --yes --use-signing-config=false --new-bundle-format=false \
            --output-signature checksums-sha256.txt.sig \
            --output-certificate checksums-sha256.txt.pem checksums-sha256.txt
          cosign sign-blob --yes --use-signing-config=false --new-bundle-format=false \
            --output-signature install-hesar.sh.sig \
            --output-certificate install-hesar.sh.pem install-hesar.sh
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          HESAR_REPOSITORY: ${{ github.repository }}
        run: |
          PREV_TAG=$(git describe --tags --match 'v*' --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            printf '## Changes\n\n'
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..HEAD" --pretty=format:'- %s (%h)'
            else
              printf 'Initial release of this HESAR edition.\n'
            fi
            printf '\n\nManagement panel: HTTP. Application traffic: TCP.\n'
            printf '\nDownload install-hesar.sh, the matching Linux archive and checksums-sha256.txt together.\n'
            printf '\nPanel setup instructions and pinned core licenses are included in each archive.\n'
            printf '\nBinary and archive hashes are signed with Sigstore using this repository tag workflow identity.\n'
          } > CHANGELOG.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: HESAR ${{ github.ref_name }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/hesar-linux-amd64.tar.gz
            release/hesar-linux-arm64.tar.gz
            release/checksums-sha256.txt
            release/checksums-sha256.txt.sig
            release/checksums-sha256.txt.pem
            release/checksums-sha256.txt.sigstore.json
            release/install-hesar.sh
            release/install-hesar.sh.sig
            release/install-hesar.sh.pem
            release/install-hesar.sh.sigstore.json
            release/BUILDINFO.json
